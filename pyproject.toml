[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[project]
name = "production-rag"
version = "0.1.0"
description = "Production-oriented RAG system, built incrementally (V0 Naive RAG)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "pypdf>=5.0",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "transformers>=4.46",
    "torch>=2.5",
    "accelerate>=1.1",
    "python-dotenv>=1.0",
    "fastembed>=0.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
