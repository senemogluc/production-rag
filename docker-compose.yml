# Data services for the RAG app. The API itself is NOT part of this file (see docs/v4-notes.md):
# it runs on the host via `uv run python serve.py` so it can use the GPU directly, instead of
# depending on Docker Desktop's GPU passthrough.
#
# Observability is Langfuse Cloud (see .env.example), not self-hosted, so no Langfuse services
# live here.
#
# Secrets below come from a local `.env` file (gitignored, not `.env.example`).

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres:
    image: docker.io/postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-ragpass} # CHANGEME
      POSTGRES_DB: ${APP_POSTGRES_DB:-production_rag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER:-raguser}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  qdrant_storage:
  postgres_data:
